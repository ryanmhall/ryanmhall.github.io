backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main # Change to master if your repo uses master

media_folder: "assets/images" # Where Minimal Mistakes stores images
public_folder: "/assets/images"

collections:
  - name: "config"
    label: "Website Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "Main Config (_config.yml)"
        file: "_config.yml"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text" }
          - { label: "Site URL", name: "url", widget: "string" }
          - { label: "Bio Name", name: "author", widget: "object", fields: [
              { label: "Display Name", name: "name", widget: "string" },
              { label: "Bio Text", name: "bio", widget: "string" },
              { label: "Avatar Image Path", name: "avatar", widget: "image" }
            ]}

  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "single" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Header Image", name: "header", widget: "object", required: false, fields: [
          { label: "Image", name: "image", widget: "image", required: false },
          { label: "Teaser Thumb", name: "teaser", widget: "image", required: false }
        ]}
      - { label: "Body Content", name: "body", widget: "markdown" }
